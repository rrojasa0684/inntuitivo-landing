name: comparativo-simplificado-check

# 25-nov-2026: comparativo simplificado ✓ ✕ — de #precio: fuentes, aria-label, desborde en 360/390/430 px, áreas táctiles y contraste, con un navegador real.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "index.html"
      - "comparativo-simplificado-check.mjs"
      - "chequeo-en-vivo-navegador.mjs"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "comparativo-simplificado-check.mjs"
      - "chequeo-en-vivo-navegador.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/comparativo-simplificado-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04      # WebKit de Playwright 1.47.2 no se instala en ubuntu-26.04 (ops/workflows-check.sh lo exige)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: node comparativo-simplificado-check.mjs
      - name: Pista de deslizar y chequeo del navegador contra el sitio local (antes de publicar)
        run: |
          python3 -m http.server 8099 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2
          node chequeo-en-vivo-navegador.mjs http://127.0.0.1:8099
