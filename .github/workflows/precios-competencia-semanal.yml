name: precios-competencia-semanal

# 1-oct-2026: una vez por semana abre las páginas públicas de precios de Apollo, Lusha y Hunter (navegador real, solo lectura) y compara
# con las cifras ancla de precios-competencia.json.
#  - Sin cambios -> actualiza SOLO el campo "verificado" (fecha de hoy) y hace commit.
#  - Algo cambió, o no se pudo confirmar, o el script falló -> abre (o comenta en) un Issue con el detalle y NO publica ningún precio.
# Nunca se publica un precio nuevo sin revisión humana.
# Permisos mínimos; sin secretos nuevos (usa el GITHUB_TOKEN de la corrida). Un commit hecho con GITHUB_TOKEN no dispara otros workflows,
# así que el commit del bot no puede volver a lanzar esta acción.

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: precios-competencia-semanal
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Verificar precios
        id: v
        run: |
          set +e
          node precios-competencia-verificar.mjs > resultado.json 2> error.txt
          echo "codigo=$?" >> "$GITHUB_OUTPUT"
      - name: Sin cambios -> solo la fecha
        if: steps.v.outputs.codigo == '0'
        run: |
          hoy=$(date -u +%F)
          sed -i -E "s/\"verificado\": *\"[0-9]{4}-[0-9]{2}-[0-9]{2}\"/\"verificado\": \"$hoy\"/" precios-competencia.json
          if git diff --quiet -- precios-competencia.json; then echo "fecha ya al día"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precios-competencia.json
          git commit -m "chore: precios de la competencia verificados el $hoy (sin cambios)"
          git push
      - name: Cambió o falló -> Issue, sin publicar nada
        # always(): también si falló un paso ANTERIOR a la verificación (npm, navegador) -- entonces `codigo` queda vacío y cuenta como falla.
        if: always() && steps.v.outputs.codigo != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create precios-competencia --color DE0540 --description "Revisión de precios de la competencia" 2>/dev/null || true
          {
            echo "La verificación semanal de precios no pudo confirmar las cifras de precios-competencia.json (código '${{ steps.v.outputs.codigo }}', vacío = falló un paso anterior a la verificación). No se publicó ni cambió ningún precio."
            echo
            echo "Qué hacer: abrir las 3 páginas, comparar con el JSON y, si cambiaron, actualizar precios-competencia.json (cifras y fecha) y la tabla de index.html en un PR."
            echo
            # Todo lo que viene del sitio de un tercero se limpia antes de ir al Issue: sin comillas invertidas (no puede cerrar el bloque de
            # código), sin '<' '>' ni '@' (ni HTML ni menciones), solo ASCII imprimible y con tope de largo. Nunca se enlaza ni se ejecuta.
            limpiar() { tr -cd '[:print:]\n' | tr -d '`<>@' | head -c 1500; }
            echo '```json'; (cat resultado.json 2>/dev/null || echo '(sin resultado)') | limpiar; echo; echo '```'
            echo '```'; (cat error.txt 2>/dev/null || true) | limpiar; echo; echo '```'
            echo
            echo "Corrida: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > cuerpo.md
          abierto=$(gh issue list --label precios-competencia --state open --json number --jq '.[0].number // empty')
          if [ -n "$abierto" ]; then
            gh issue comment "$abierto" --body-file cuerpo.md
          else
            gh issue create --title "Precios de la competencia: revisar" --label precios-competencia --body-file cuerpo.md
          fi
          exit 1
