name: workflows-check

# 25-nov-2026: ningún flujo queda con YAML inválido ni con una instalación que el runner no puede hacer. Ver ops/workflows-check.sh. Si este mismo flujo quedara ilegible, el latido de avisar-motor lo reporta.

on:
  pull_request:
    paths: [".github/workflows/**", "ops/workflows-check*.sh"]
  push:
    branches: [main]
    paths: [".github/workflows/**", "ops/workflows-check*.sh"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: actionlint fijado por versión y huella
        run: |
          curl -fsSL --proto =https -o "$RUNNER_TEMP/al.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/al.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/al.tar.gz" -C "$RUNNER_TEMP" actionlint
      - run: bash ops/workflows-check-prueba.sh
      - run: ACTIONLINT="$RUNNER_TEMP/actionlint" bash ops/workflows-check.sh
