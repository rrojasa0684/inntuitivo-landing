name: revisar-repl-check

# 20-nov-2026: el hook de Code Mode (REPL) tiene que estar registrado en main de la landing y bloquear lo prohibido aunque venga armado (mismos casos que el motor).
on:
  push:
    branches: [main]
    paths:
      - ".claude/**"
      - "revisar-repl-check.sh"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash revisar-repl-check.sh
