<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&amp;family=Questrial&amp;display=swap" rel="stylesheet"/>
<style>
  body { margin: 0; background: #0b0616; }
  a { color: #DE0540; text-decoration: none; }
  a:hover { color: #ff2e63; }
  @keyframes marquee { from { transform: translate3d(0,0,0); } to { transform: translate3d(-50%,0,0); } }
  @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: .9; } }
  .marquee-track { animation: marquee var(--dur, 46s) linear infinite; }
  .marquee-wrap:hover .marquee-track { animation-play-state: paused; }
  .logo-item img { opacity: .55; transition: opacity .35s ease, transform .35s ease; }
  .logo-item:hover img { opacity: 1; transform: scale(1.05); }
  .star { position: absolute; border-radius: 50%; background: #fff; animation: twinkle 4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .marquee-track, .star { animation: none; } }
</style>
</helmet>
<section class="partners-section" style="position: relative; overflow: hidden; background: radial-gradient(120% 90% at 50% 0%, #452774 0%, #1b0e33 45%, #0b0616 100%); border-top: 1px solid rgba(255,255,255,.08); border-bottom: 1px solid rgba(255,255,255,.08); padding: 84px 0 88px; font-family: Questrial, 'Century Gothic', Helvetica, Arial, sans-serif;">
  <div style="position: absolute; inset: 0; pointer-events: none;">
    <div class="star" style="left: 6%; top: 18%; width: 3px; height: 3px; animation-delay: 0s;"></div>
    <div class="star" style="left: 14%; top: 62%; width: 2px; height: 2px; animation-delay: 1.2s;"></div>
    <div class="star" style="left: 27%; top: 12%; width: 2px; height: 2px; animation-delay: 2.4s;"></div>
    <div class="star" style="left: 39%; top: 78%; width: 3px; height: 3px; animation-delay: .6s;"></div>
    <div class="star" style="left: 52%; top: 8%; width: 2px; height: 2px; animation-delay: 3.1s;"></div>
    <div class="star" style="left: 66%; top: 70%; width: 2px; height: 2px; animation-delay: 1.8s;"></div>
    <div class="star" style="left: 78%; top: 22%; width: 3px; height: 3px; animation-delay: 2.9s;"></div>
    <div class="star" style="left: 88%; top: 56%; width: 2px; height: 2px; animation-delay: .3s;"></div>
    <div class="star" style="left: 94%; top: 14%; width: 2px; height: 2px; animation-delay: 1.5s;"></div>
    <div style="position: absolute; left: 50%; top: -260px; transform: translateX(-50%); width: 900px; height: 420px; border-radius: 50%; background: radial-gradient(closest-side, rgba(222,5,64,.28), transparent 70%); filter: blur(10px);"></div>
  </div>
  <div style="position: relative; max-width: 1200px; margin: 0 auto; padding: 0 32px; display: flex; flex-direction: column; align-items: center; gap: 18px;">
    <span style="display: inline-flex; align-items: center; gap: 8px; padding: 7px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: #e9e2f7; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;">🪐 Partners</span>
    <h2 style="margin: 0; font-family: Audiowide, Questrial, Helvetica, Arial, sans-serif; font-size: 34px; line-height: 1.3; font-weight: 400; color: #ffffff; text-align: center; text-wrap: balance;">{{ titulo }}</h2>
    <p style="margin: 0; max-width: 620px; text-align: center; font-size: 17px; line-height: 1.6; color: rgba(233,226,247,.72); text-wrap: pretty;">{{ subtitulo }}</p>
  </div>
  <div class="marquee-wrap" style="position: relative; margin-top: 60px; -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);">
    <div class="marquee-track" style="display: flex; width: max-content; --dur: 46s;">
      <div style="display: flex; align-items: center; gap: 88px; padding-right: 88px;">
        <div class="logo-item" style="flex: 0 0 auto;"><img src="logos-blanco/aws.png" alt="AWS for Startups" style="height: 56px; width: auto; display: block;"/></div>
        <div class="logo-item" style="flex: 0 0 auto;"><img src="logos-blanco/microsoft-founders-hub.png" alt="Microsoft for Startups Founders Hub" style="height: 56px; width: auto; display: block;"/></div>
        <div class="logo-item" style="flex: 0 0 auto;"><img src="logos-blanco/google-for-startups.png" alt="Google for Startups" style="height: 56px; width: auto; display: block;"/></div>
        <div class="logo-item" style="flex: 0 0 auto;"><img src="logos-blanco/openai.png" alt="OpenAI" style="height: 56px; width: auto; display: block;"/></div>
        <div class="logo-item" style="flex: 0 0 auto;"><img src="logos-blanco/claude.png" alt="Claude" style="height: 56px; width: auto; display: block;"/></div>
        <div class="logo-item" style="flex: 0 0 auto;"><img src="logos-blanco/hubspot-for-startups.png" alt="HubSpot for Startups" style="height: 56px; width: auto; display: block;"/></div>
        <div class="logo-item" style="flex: 0 0 auto;"><img src="logos-blanco/neural-coders.png" alt="Neural Coders" style="height: 56px; width: auto; display: block;"/></div>
        <div class="logo-item" style="flex: 0 0 auto;"><img src="logos-blanco/mural.png" alt="Mural" style="height: 56px; width: auto; display: block;"/></div>
        <div class="logo-item" style="flex: 0 0 auto;"><img src="logos-blanco/scrumstudy.png" alt="SCRUMstudy Authorized Training Partner" style="height: 56px; width: auto; display: block;"/></div>
        <div class="logo-item" style="flex: 0 0 auto;"><img src="logos-blanco/advice-legal.png" alt="Advice Legal Studio" style="height: 56px; width: auto; display: block;"/></div>
      </div>
      <div style="display: flex; align-items: center; gap: 88px; padding-right: 88px;" aria-hidden="true">
        <div class="logo-item" style="flex: 0 0 auto;"><img src="logos-blanco/aws.png" alt="" style="height: 56px; width: auto; display: block;"/></div>
        <div class="logo-item" style="flex: 0 0 auto;"><img src="logos-blanco/microsoft-founders-hub.png" alt="" style="height: 56px; width: auto; display: block;"/></div>
        <div class="logo-item" style="flex: 0 0 auto;"><img src="logos-blanco/google-for-startups.png" alt="" style="height: 56px; width: auto; display: block;"/></div>
        <div class="logo-item" style="flex: 0 0 auto;"><img src="logos-blanco/openai.png" alt="" style="height: 56px; width: auto; display: block;"/></div>
        <div class="logo-item" style="flex: 0 0 auto;"><img src="logos-blanco/claude.png" alt="" style="height: 56px; width: auto; display: block;"/></div>
        <div class="logo-item" style="flex: 0 0 auto;"><img src="logos-blanco/hubspot-for-startups.png" alt="" style="height: 56px; width: auto; display: block;"/></div>
        <div class="logo-item" style="flex: 0 0 auto;"><img src="logos-blanco/neural-coders.png" alt="" style="height: 56px; width: auto; display: block;"/></div>
        <div class="logo-item" style="flex: 0 0 auto;"><img src="logos-blanco/mural.png" alt="" style="height: 56px; width: auto; display: block;"/></div>
        <div class="logo-item" style="flex: 0 0 auto;"><img src="logos-blanco/scrumstudy.png" alt="" style="height: 56px; width: auto; display: block;"/></div>
        <div class="logo-item" style="flex: 0 0 auto;"><img src="logos-blanco/advice-legal.png" alt="" style="height: 56px; width: auto; display: block;"/></div>
      </div>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:440},&quot;titulo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Empresas que confían en Inntuitivo 🚀&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitulo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Empresas, startups, inversionistas, programas, plataformas y equipos con los que trabajamos para poner tu agente de IA en órbita. 🪐&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tema&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Oscuro&quot;,&quot;Claro&quot;],&quot;default&quot;:&quot;Oscuro&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Adaptación al sitio&quot;},&quot;velocidad&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:46,&quot;min&quot;:15,&quot;max&quot;:90,&quot;step&quot;:1,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;alturaLogo&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:56,&quot;min&quot;:32,&quot;max&quot;:90,&quot;step&quot;:2,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;opacidad&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.55,&quot;min&quot;:0.2,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  componentDidMount() { this.sync(); }
  componentDidUpdate() { this.sync(); }
  sync() {
    this.applyTheme();
    const track = document.querySelector('.marquee-track');
    if (track) track.style.setProperty('--dur', (this.props.velocidad ?? 46) + 's');
    document.querySelectorAll('.logo-item img').forEach(img => {
      img.style.height = (this.props.alturaLogo ?? 56) + 'px';
      img.style.opacity = (this.props.opacidad ?? 0.55);
    });
  }
  applyTheme() {
    const claro = (this.props.tema ?? 'Oscuro') === 'Claro';
    const sec = document.querySelector('.partners-section');
    const h2 = document.querySelector('.partners-section h2');
    const p = document.querySelector('.partners-section p');
    const pill = document.querySelector('.partners-section span');
    const stars = document.querySelector('.partners-section > div');
    if (sec) {
      sec.style.background = claro
        ? 'linear-gradient(180deg, #ffffff 0%, #f6f3fb 100%)'
        : 'radial-gradient(120% 90% at 50% 0%, #452774 0%, #1b0e33 45%, #0b0616 100%)';
      sec.style.borderTopColor = sec.style.borderBottomColor = claro ? 'rgba(69,39,116,.12)' : 'rgba(255,255,255,.08)';
    }
    if (stars) stars.style.display = claro ? 'none' : 'block';
    if (h2) h2.style.color = claro ? '#241540' : '#ffffff';
    if (p) p.style.color = claro ? 'rgba(36,21,64,.66)' : 'rgba(233,226,247,.72)';
    if (pill) {
      pill.style.color = claro ? '#452774' : '#e9e2f7';
      pill.style.borderColor = claro ? 'rgba(69,39,116,.22)' : 'rgba(255,255,255,.16)';
      pill.style.background = claro ? 'rgba(69,39,116,.06)' : 'rgba(255,255,255,.06)';
    }
    document.querySelectorAll('.logo-item img').forEach(img => {
      const file = img.getAttribute('src').split('/').pop();
      img.setAttribute('src', (claro ? 'logos/' : 'logos-blanco/') + file);
    });
  }
  renderVals() {
    return {
      titulo: this.props.titulo ?? 'Empresas que confían en Inntuitivo 🚀',
      subtitulo: this.props.subtitulo ?? 'Empresas, startups, inversionistas, programas, plataformas y equipos con los que trabajamos para poner tu agente de IA en órbita. 🪐'
    };
  }
}
</script>
</body>
</html>
