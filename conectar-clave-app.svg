  <text x="383" y="111" fill="#C8F4E2" font-family="monospace" font-size="18" text-anchor="middle">abcd efgh ijkl mnop</text>
  <text x="242" y="156" fill="#E7DEF7" font-family="sans-serif" font-size="13">3 · Pégalas en el cuadro de abajo,</text>
  <text x="242" y="176" fill="#E7DEF7" font-family="sans-serif" font-size="13">sin espacios.</text>
