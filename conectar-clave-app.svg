  <rect x="20" y="44" width="160" height="150" rx="10" fill="#2B1D5C" stroke="#6C5BA8"/>
  <text x="34" y="70" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700">1 · Nombre</text>
  <rect x="34" y="84" width="132" height="30" rx="6" fill="#120B2E" stroke="#8E80B3"/>
  <text x="44" y="104" fill="#E7DEF7" font-family="sans-serif" font-size="13">Inntuitivo</text>
  <rect x="34" y="132" width="132" height="34" rx="17" fill="#DE0540"/>
  <text x="100" y="154" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Crear</text>
  <path d="M190 119 L214 119" stroke="#FF6E92" stroke-width="3" fill="none"/><path d="M208 112 L216 119 L208 126" stroke="#FF6E92" stroke-width="3" fill="none"/>
  <rect x="226" y="44" width="314" height="150" rx="10" fill="#2B1D5C" stroke="#6C5BA8"/>
